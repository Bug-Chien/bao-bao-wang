<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2a4a">
<title>爆爆水球大作戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bubbles" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<!-- 主選單 -->
<div id="screen-menu" class="screen">
  <div class="logo-wrap">
    <div class="logo-emoji">💣</div>
    <h1 class="logo">爆爆水球<br>大作戰</h1>
    <div class="logo-sub">Bubble Bomber Battle</div>
  </div>
  <div class="menu-box">
    <button id="btn-menu-single" class="big-btn"><span class="bi">🤖</span>單機模式</button>
    <button id="btn-menu-online" class="big-btn"><span class="bi">🌐</span>線上多人</button>
    <button id="btn-menu-settings" class="big-btn ghost"><span class="bi">⚙️</span>設定</button>
  </div>
  <div class="hint">方向鍵 / WASD 移動・空白鍵放水球（受困時自救）</div>
</div>

<!-- 單機設定 -->
<div id="screen-single" class="screen hidden">
  <div class="panel">
    <h2>單機模式</h2>
    <h3>選擇地圖</h3>
    <div id="single-maps" class="map-picker"></div>
    <h3>電腦對手數量</h3>
    <div id="single-bots" class="seg">
      <button data-n="1">1</button>
      <button data-n="2">2</button>
      <button data-n="3" class="sel">3</button>
    </div>
    <div class="btn-row">
      <button class="btn-back ghost">返回</button>
      <button id="btn-single-start" class="big-btn">開始遊戲</button>
    </div>
  </div>
</div>

<!-- 線上大廳：房間列表 -->
<div id="screen-online" class="screen hidden">
  <div class="panel">
    <h2>線上多人</h2>
    <div id="online-status" class="status"></div>
    <div class="create-row">
      <input id="new-room-name" type="text" placeholder="房間名稱…" maxlength="16">
      <button id="btn-create-room">＋ 建立</button>
      <button id="btn-refresh-rooms" class="ghost icon-btn" title="重新整理">🔄</button>
    </div>
    <div id="room-list" class="room-list"></div>
    <div class="btn-row"><button class="btn-back ghost">返回</button></div>
  </div>
</div>

<!-- 房間（等待室） -->
<div id="screen-lobby" class="screen hidden">
  <div class="panel">
    <h2 id="lobby-title">房間</h2>
    <div class="lobby-grid" id="lobby-players"></div>
    <h3>地圖：<span id="lobby-map-name"></span></h3>
    <div id="lobby-maps" class="map-picker"></div>
    <div class="btn-row">
      <button id="btn-leave-room" class="ghost">離開</button>
      <button id="btn-ready" class="big-btn">準備</button>
      <button id="btn-start" class="big-btn">開始遊戲</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div id="screen-settings" class="screen hidden">
  <div class="panel">
    <h2>設定</h2>
    <div class="form-row"><label>暱稱</label><input id="set-name" type="text" maxlength="10"></div>
    <div class="form-row"><label>音效</label><label class="switch"><input id="set-sound" type="checkbox"><span class="slider"></span></label></div>
    <div class="btn-row">
      <button class="btn-back ghost">返回</button>
      <button id="btn-settings-save" class="big-btn">儲存</button>
    </div>
  </div>
</div>

<!-- 遊戲畫面 -->
<div id="screen-game" class="screen hidden">
  <div class="game-top">
    <button id="btn-game-leave" class="icon-btn ghost" title="離開">✕</button>
    <div id="game-hud"></div>
  </div>
  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="match-banner" class="hidden"></div>
  </div>
  <div id="touch-ui">
    <div id="joy-zone"></div>
    <div id="joystick"><div id="joy-knob"></div></div>
    <div id="btn-action">💣</div>
  </div>
  <div id="result-overlay" class="hidden">
    <div class="result-box">
      <div id="result-title">結果</div>
      <div id="result-sub"></div>
      <div class="btn-row">
        <button id="btn-result-exit" class="ghost">離開</button>
        <button id="btn-rematch" class="big-btn">再來一場</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/engine.js"></script>
<script src="js/bot.js"></script>
<script src="js/sound.js"></script>
<script src="js/controls.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
