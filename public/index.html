<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>爆爆水球大作戰</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 主選單 -->
<div id="screen-menu" class="screen">
  <h1 class="logo">💣 爆爆水球大作戰</h1>
  <div class="menu-box">
    <button id="btn-menu-single" class="big-btn">🤖 單機模式</button>
    <button id="btn-menu-online" class="big-btn">🌐 線上多人</button>
    <button id="btn-menu-settings" class="big-btn">⚙️ 設定</button>
  </div>
  <div class="hint">方向鍵/WASD 移動・空白鍵 放水球（受困時用針）</div>
</div>

<!-- 單機設定 -->
<div id="screen-single" class="screen hidden">
  <h2>單機模式</h2>
  <h3>選擇地圖</h3>
  <div id="single-maps" class="map-picker"></div>
  <h3>電腦對手數量</h3>
  <div id="single-bots" class="btn-row">
    <button data-n="1">1</button>
    <button data-n="2">2</button>
    <button data-n="3" class="sel">3</button>
  </div>
  <div class="btn-row">
    <button id="btn-single-start" class="big-btn">開始遊戲</button>
    <button class="btn-back">返回</button>
  </div>
</div>

<!-- 線上大廳：房間列表 -->
<div id="screen-online" class="screen hidden">
  <h2>線上多人</h2>
  <div id="online-status" class="status"></div>
  <div class="btn-row">
    <input id="new-room-name" type="text" placeholder="房間名稱" maxlength="16">
    <button id="btn-create-room">建立房間</button>
    <button id="btn-refresh-rooms">🔄 重新整理</button>
  </div>
  <div id="room-list" class="room-list"></div>
  <div class="btn-row"><button class="btn-back">返回</button></div>
</div>

<!-- 房間（等待室） -->
<div id="screen-lobby" class="screen hidden">
  <h2 id="lobby-title">房間</h2>
  <div id="lobby-players" class="lobby-players"></div>
  <h3>地圖：<span id="lobby-map-name"></span></h3>
  <div id="lobby-maps" class="map-picker"></div>
  <div class="btn-row">
    <button id="btn-ready" class="big-btn">準備</button>
    <button id="btn-start" class="big-btn">開始遊戲</button>
    <button id="btn-leave-room">離開房間</button>
  </div>
</div>

<!-- 設定 -->
<div id="screen-settings" class="screen hidden">
  <h2>設定</h2>
  <div class="form-row"><label>暱稱</label><input id="set-name" type="text" maxlength="10"></div>
  <div class="form-row"><label>音效</label><input id="set-sound" type="checkbox"></div>
  <div class="btn-row">
    <button id="btn-settings-save" class="big-btn">儲存</button>
    <button class="btn-back">返回</button>
  </div>
</div>

<!-- 遊戲畫面 -->
<div id="screen-game" class="screen hidden">
  <div id="game-hud"></div>
  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="touch-ui">
    <div id="joystick"><div id="joy-knob"></div></div>
    <div id="btn-action">💣</div>
  </div>
  <div id="result-overlay" class="hidden">
    <div class="result-box">
      <div id="result-title">結果</div>
      <button id="btn-rematch" class="big-btn">再來一場</button>
      <button id="btn-result-exit" class="big-btn">離開</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/engine.js"></script>
<script src="js/bot.js"></script>
<script src="js/sound.js"></script>
<script src="js/controls.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
